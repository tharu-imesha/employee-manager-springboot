<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #ffc107;
            padding-bottom: 8px;
        }
        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
        form input[type="text"],
        form input[type="email"],
        form input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: red;
            font-size: 0.85em;
            margin-top: 3px;
        }
        button {
            background-color: #ffc107;
            color: #333;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover {
            background-color: #e0a800;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #007bff;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Edit Employee Details</h2>

        <form action="#" th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
            <label>Full Name:</label>
            <input type="text" th:field="*{fullName}" />
            <p class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

            <label>Email:</label>
            <input type="email" th:field="*{email}" />
            <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

            <label>Phone:</label>
            <input type="text" th:field="*{phone}" />

            <label>Department:</label>
            <input type="text" th:field="*{department}" />

            <label>Salary:</label>
            <input type="number" step="any" th:field="*{salary}" />
            <p class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></p>

            <button type="submit">Update Employee</button>
        </form>

        <a class="back-link" th:href="@{/employees}">← Back to Employee List</a>
    </div>

</body>
</html>
